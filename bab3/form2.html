<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Radia button: hanya bisa memilih satu opsi-->
    <!-- gunakan nama yang sama untuk mengelompokkan pilihan-->
     <p>jenisa kelamin</p>
     <input type="radio" name="gender" id="laki" value="L">
     <label for="laki">laki laki</label>

     <input type="radio" name="gender" id="perempuan" value="P">
     <label for="perempuan">perempuan</label>

     <!-- chexbox: bisa memilih lebih dari satu-->
    <p>hobi (boleh pilih lebih dari satu)</p>
    <input type="checkbox" id="coding" name="hobi" value="coding">
    <label for="coding">coding</label>

    <input type="checkbox" id="membaca" name="hobi" value="membaca">
    <label for="membaca">membaca</label>

    <input type="checkbox" id="gaming" name="hobi" value="gaming">
    <label for="gaming">gaming</label>

    <!-- chexbox dengan chacked (sudah di centang secara default)-->
     <input type="checkbox" id="setuju" name="setuju" value="ya" checked>
     <label for="setuju">saya menyutujui syarat dan ketentuan</label>


</body>
</html>
